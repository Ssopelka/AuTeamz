<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка формы</title>
<style>body{background:#0b0d10;color:#e4e6eb;font:14px/1.6 ui-monospace,monospace;padding:16px}
pre{white-space:pre-wrap;word-break:break-all;background:#12161b;border:1px solid #1c2026;padding:10px}
.ok{color:#7ddf7d}.err{color:#ff6b6b}</style></head><body>
<h1 style="color:#f0b429;font-size:16px">Проверка отправки заявки</h1>
<pre id="out">запускаю…</pre>
<script>
var L=[];function say(t){L.push(t);document.getElementById('out').textContent=L.join('\n');}
var URL_='https://auteamz-lead.soplya-stalina.workers.dev/';
say('адрес: '+URL_);
var t0=Date.now();
var ctrl=new AbortController();
var timer=setTimeout(function(){ctrl.abort();say('⏱ прервано по таймауту 20 с — ответ не пришёл');},20000);
fetch(URL_,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
  body:JSON.stringify({name:'Проверка',contact:'test@auteamz.ru',task:'Проверка доставки заявок, письма быть не должно',botcheck:true,consent:true,consentVersion:'test',page:location.href})})
 .then(function(r){clearTimeout(timer);say('ответ за '+(Date.now()-t0)+' мс, код '+r.status);return r.text();})
 .then(function(b){say('тело: '+b);say('ЗАПРОС ПРОШЁЛ');})
 .catch(function(e){clearTimeout(timer);say('ОШИБКА через '+(Date.now()-t0)+' мс: '+(e&&e.message?e.message:e));});
</script></body></html>
